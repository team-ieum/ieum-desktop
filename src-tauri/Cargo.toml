[package]
name = "ieum-desktop"
version = "0.1.0"
description = "IEUM 데스크톱 — 내 PC에서 도는 폴더·파일 자동화"
authors = ["IEUM"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ieum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ieum-engine = { version = "0.1.0", path = "../crates/ieum-engine" }
ieum-local = { version = "0.1.0", path = "../crates/ieum-local" }
tokio = { version = "1.54.1", default-features = false, features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7.20"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1.29.2", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
sha2 = "0.10.9"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
