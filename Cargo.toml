[workspace]
resolver = "3"
members = [
    "crates/ieum-engine",
    "crates/ieum-local",
    "crates/ieum-cli",
    "src-tauri",
]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
