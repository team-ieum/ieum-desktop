[package]
name = "ieum-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
chrono-tz = "0.10.4"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "rt", "macros"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.2", features = ["v4"] }
