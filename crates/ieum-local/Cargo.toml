[package]
name = "ieum-local"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
ieum-engine = { path = "../ieum-engine" }
notify = "8.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "rt", "macros"] }
tokio-util = "0.7.20"
