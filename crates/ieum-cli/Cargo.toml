[package]
name = "ieum-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ieum-dev"
path = "src/main.rs"

[[bin]]
name = "ieum"
path = "src/bin/ieum.rs"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4", features = ["derive"] }
ieum-engine = { path = "../ieum-engine" }
ieum-local = { path = "../ieum-local" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
tokio-util = "0.7.20"

[dev-dependencies]
tempfile = "3"
